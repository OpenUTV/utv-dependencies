name: Linux (Rocky) - Build Dependencies (vcpkg)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rocky:
    runs-on: ubuntu-latest
    container: rockylinux:9
    steps:
      - name: Install Git and Sudo
        run: |
          dnf install -y git sudo
          git config --global --add safe.directory "*"

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Install System Prerequisites
        run: |
          dnf install -y epel-release
          dnf config-manager --set-enabled crb
          dnf groupinstall -y "Development Tools"
          (dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo || true)
          dnf install -y --allowerasing \
            cmake \
            git \
            ninja-build \
            tar \
            unzip \
            zip \
            pkgconfig \
            gh \
            autoconf \
            automake \
            autoconf-archive \
            libtool \
            m4 \
            bison \
            flex \
            gperf \
            nasm \
            yasm \
            libtool-ltdl-devel \
            gettext-devel \
            rpm-build \
            libX11-devel \
            libXft-devel \
            libXext-devel \
            mesa-libGL-devel \
            mesa-libGLU-devel \
            libXcursor-devel \
            libXi-devel \
            libXinerama-devel \
            libXrandr-devel \
            fontconfig-devel \
            alsa-lib-devel \
            pulseaudio-libs-devel \
            systemd-devel \
            libva-devel \
            libvdpau-devel \
            perl-IPC-Cmd \
            perl-FindBin \
            libXtst-devel \
            libXrender-devel \
            libXfixes-devel \
            libXcomposite-devel \
            libXdamage-devel \
            libxkbcommon-devel \
            libxkbcommon-x11-devel \
            dbus-devel

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/vcpkg'
          vcpkgGitCommitId: '759f4cca281639f2a0541741c80372012c92477e'

      - name: Restore vcpkg downloads
        id: restore-downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-rocky-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-rocky-

      - name: Restore vcpkg binary cache
        id: restore-binary-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.workspace }}/vcpkg_cache
          key: vcpkg-binaries-rocky-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binaries-rocky-

      - name: Warm up vcpkg downloads
        shell: bash
        run: |
          "${{ runner.workspace }}/vcpkg/vcpkg" install --triplet x64-linux --only-downloads --overlay-ports=ports --x-install-root="${{ runner.workspace }}/vcpkg/installed" || true

      - name: Save vcpkg downloads
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-rocky-${{ hashFiles('vcpkg.json') }}

      - name: Force Release Build Only
        run: |
          echo "set(VCPKG_BUILD_TYPE release)" >> "${{ runner.workspace }}/vcpkg/triplets/x64-linux.cmake"

      - name: Install All Dependencies (Manifest Mode)
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.workspace }}/vcpkg_cache,readwrite"
        run: |
          "${{ runner.workspace }}/vcpkg/vcpkg" install \
            --triplet x64-linux \
            --x-install-root="${{ runner.workspace }}/vcpkg/installed" \
            --overlay-ports=ports \
            --clean-after-build

      - name: Save Binaries Cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.workspace }}/vcpkg_cache
          key: vcpkg-binaries-rocky-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Configure Environment
        shell: bash
        run: |
          PYTHON_EXEC="${{ runner.workspace }}/vcpkg/installed/x64-linux/bin/python3"
          echo "VCPKG_PYTHON=$PYTHON_EXEC" >> $GITHUB_ENV
          echo "Python3_EXECUTABLE=$PYTHON_EXEC" >> $GITHUB_ENV
          echo "Python3_ROOT_DIR=$(dirname $(dirname $PYTHON_EXEC))" >> $GITHUB_ENV
          echo "$(dirname $PYTHON_EXEC)" >> $GITHUB_PATH

      - name: Prepare Binary Archive for CPack
        run: |
          mkdir -p exported_deps
          # Move the installed tree to the location expected by CMakeLists.txt
          mv "${{ runner.workspace }}/vcpkg/installed/x64-linux" "exported_deps/utv-deps-linux-x64"

      - name: Package RPM Installer (CPack)
        run: |
          mkdir build
          cd build
          cmake -G Ninja ..
          cpack -G RPM -C Release

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CMAKE_VER=$(grep -i "project(OpenUTVDependencies VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9\.]+).*/\1/')
          VERSION="v${CMAKE_VER}"
          gh release create $VERSION build/*.rpm -t "Linux x64 Dependencies $VERSION" -n "Source-driven dependency build ($VERSION)" || gh release upload $VERSION build/*.rpm --clobber
