name: Windows - Build Dependencies (vcpkg)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Enable Windows Long Path Support
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1
          git config --system core.longpaths true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ runner.workspace }}/vcpkg'
          vcpkgGitCommitId: 'a1cae005c39be7b18ba319fced856b68d7276271'

      - name: Restore vcpkg downloads
        id: restore-downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-downloads-

      - name: Restore vcpkg binary cache
        id: restore-binary-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.workspace }}/vcpkg_cache
          key: vcpkg-binaries-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-binaries-

      - name: Warm up vcpkg downloads
        shell: bash
        run: |
          "${{ runner.workspace }}/vcpkg/vcpkg" install --triplet x64-windows --only-downloads --overlay-ports=ports --x-install-root="${{ runner.workspace }}/vcpkg/installed" || true

      - name: Save vcpkg downloads
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.workspace }}/vcpkg/downloads
          key: vcpkg-downloads-${{ hashFiles('vcpkg.json') }}

      - name: Check vcpkg Version
        shell: bash
        run: |
          "${{ runner.workspace }}/vcpkg/vcpkg" version

      - name: Force Release Build Only
        run: |
          Add-Content -Path "${{ runner.workspace }}/vcpkg/triplets/x64-windows.cmake" -Value "set(VCPKG_BUILD_TYPE release)" -Encoding ascii

      - name: Install All Dependencies (Manifest Mode)
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.workspace }}/vcpkg_cache,readwrite"
        run: |
          "${{ runner.workspace }}/vcpkg/vcpkg" install \
            --triplet x64-windows \
            --x-install-root="${{ runner.workspace }}/vcpkg/installed" \
            --overlay-ports=ports \
            --clean-after-build

      - name: Configure Environment
        shell: bash
        run: |
          # Identify the installed Python and set env vars for the manifest run
          if [ -f "${{ runner.workspace }}/vcpkg/installed/x64-windows/tools/python3/python.exe" ]; then
            PYTHON_EXEC="${{ runner.workspace }}/vcpkg/installed/x64-windows/tools/python3/python.exe"
          else
            PYTHON_EXEC="${{ runner.workspace }}/vcpkg/installed/x64-windows/bin/python.exe"
          fi
          
          echo "VCPKG_PYTHON=$PYTHON_EXEC" >> $GITHUB_ENV
          echo "Python3_EXECUTABLE=$PYTHON_EXEC" >> $GITHUB_ENV
          echo "Python3_ROOT_DIR=$(dirname "$PYTHON_EXEC")" >> $GITHUB_ENV
          echo "$(dirname "$PYTHON_EXEC")" >> $GITHUB_PATH

      - name: Save Binaries Cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.workspace }}/vcpkg_cache
          key: vcpkg-binaries-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}

      - name: Prepare Binary Archive for CPack
        shell: bash
        run: |
          mkdir -p exported_deps
          # Move the installed tree to the location expected by CMakeLists.txt
          mv "${{ runner.workspace }}/vcpkg/installed/x64-windows" "exported_deps/utv-deps-windows-x64"

          # 1. Strip debug symbol files (.pdb) from bin/ to reduce bloat (~760 MB)
          echo "Stripping .pdb debug symbols..."
          find exported_deps/utv-deps-windows-x64 -name "*.pdb" -type f -delete

          # 2. Remove Windows SDK import libraries not authorized for third-party distribution
          echo "Removing unauthorized Windows SDK import libraries..."
          find exported_deps/utv-deps-windows-x64 -iname "OpenGL32.Lib" -type f -delete
          find exported_deps/utv-deps-windows-x64 -iname "GlU32.Lib" -type f -delete

          # 3. Remove OpenSSL extraneous nested Program Files / Common Files directory
          echo "Removing extraneous nested OpenSSL directory..."
          rm -rf "exported_deps/utv-deps-windows-x64/Program Files"
          rm -rf "exported_deps/utv-deps-windows-x64/Common Files"

          # 4. Ensure python3.dll is installed for abi3 extension compatibility
          if [ ! -f "exported_deps/utv-deps-windows-x64/tools/python3/python3.dll" ]; then
            find "${{ runner.workspace }}" -name "python3.dll" -exec cp {} "exported_deps/utv-deps-windows-x64/tools/python3/" \; -quit || true
            find "${{ runner.workspace }}" -name "python3.dll" -exec cp {} "exported_deps/utv-deps-windows-x64/bin/" \; -quit || true
          fi

          # 5. Copy MSVC CRT runtime DLLs into bin and tools/python3
          CRT_DIR=$(find "/c/Program Files/Microsoft Visual Studio" -name "vcruntime140.dll" 2>/dev/null | grep -i x64 | head -n 1 | xargs dirname)
          if [ -n "$CRT_DIR" ]; then
            echo "Deploying CRT from $CRT_DIR..."
            cp "$CRT_DIR"/*.dll "exported_deps/utv-deps-windows-x64/bin/" || true
            cp "$CRT_DIR"/*.dll "exported_deps/utv-deps-windows-x64/tools/python3/" || true
          fi

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Install PySide6 into Bundled Python
        shell: bash
        run: |
          DEST_SITE_PACKAGES="exported_deps/utv-deps-windows-x64/tools/python3/Lib/site-packages"
          mkdir -p "$DEST_SITE_PACKAGES"
          uv pip install \
            --python-platform windows \
            --python-version 3.14 \
            --target "$DEST_SITE_PACKAGES" \
            PySide6==6.11.2

      - name: Configure WiX Long Path Support
        run: |
          $wixDir = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (Test-Path $wixDir) {
            @("candle.exe", "light.exe", "heat.exe", "lit.exe", "pyro.exe", "torch.exe") | ForEach-Object {
              $configFile = Join-Path $wixDir "$_.config"
              if (Test-Path $configFile) {
                [xml]$config = Get-Content $configFile
              } else {
                [xml]$config = "<configuration><runtime/></configuration>"
              }
              if (-not $config.configuration) {
                $config.AppendChild($config.CreateElement("configuration")) | Out-Null
              }
              if (-not $config.configuration.runtime) {
                $config.configuration.AppendChild($config.CreateElement("runtime")) | Out-Null
              }
              $override = $config.configuration.runtime.AppContextSwitchOverrides
              if (-not $override) {
                $override = $config.CreateElement("AppContextSwitchOverrides")
                $config.configuration.runtime.AppendChild($override) | Out-Null
              }
              $override.SetAttribute("value", "Switch.System.IO.UseLegacyPathHandling=false;Switch.System.IO.BlockLongPaths=false")
              $config.Save($configFile)
            }
          }

      - name: Package MSI Installer (CPack WiX)
        shell: bash
        run: |
          mkdir -p C:/b
          cd C:/b
          cmake -G "Visual Studio 18 2026" "$GITHUB_WORKSPACE"
          cpack -G WIX -C Release --debug --verbose
          mkdir -p "$GITHUB_WORKSPACE/build"
          cp C:/b/OpenUTVDeps-*.msi "$GITHUB_WORKSPACE/build/" || cp C:/b/_CPack_Packages/win64/WIX/OpenUTVDeps-*.msi "$GITHUB_WORKSPACE/build/"

      - name: Package Source Code Archive for LGPL Compliance
        shell: bash
        run: |
          CMAKE_VER=$(grep -i "project(OpenUTVDependencies VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9\.]+).*/\1/')
          mkdir -p "$GITHUB_WORKSPACE/build"
          echo "Packaging corresponding source code from vcpkg downloads..."
          tar --force-local -czf "$GITHUB_WORKSPACE/build/openutv-deps-sources-${CMAKE_VER}.tar.gz" -C "${{ runner.workspace }}/vcpkg/downloads" .

      - name: Show WiX log on failure
        if: failure()
        shell: bash
        run: |
          find C:/b build -name "wix.log" -exec cat {} + 2>/dev/null || true

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CMAKE_VER=$(grep -i "project(OpenUTVDependencies VERSION" CMakeLists.txt | sed -E 's/.*VERSION ([0-9\.]+).*/\1/')
          VERSION="v${CMAKE_VER}"
          gh release create $VERSION \
            build/OpenUTVDeps-${CMAKE_VER}-win64.msi \
            build/openutv-deps-sources-${CMAKE_VER}.tar.gz \
            -t "Windows x64 Dependencies $VERSION" \
            -n "Source-driven dependency build ($VERSION)" \
            || gh release upload $VERSION \
              build/OpenUTVDeps-${CMAKE_VER}-win64.msi \
              build/openutv-deps-sources-${CMAKE_VER}.tar.gz \
              --clobber
